name: Deploy to GitHub Pages

# Deploy the static index.html to GitHub Pages on every push to main.
# NOTE: ต้องเปิดใช้งานครั้งแรกที่ Settings > Pages > Source = "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้ deploy ทีละงาน ไม่รันซ้อนกัน
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # serve ทั้งโฟลเดอร์ root (index.html อยู่ที่นี่)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
